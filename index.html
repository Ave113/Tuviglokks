<!doctype html>
<html lang="vi-VN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ứng dụng lập lá số Tử Vi Đẩu Số chuẩn xác theo giờ địa chi, hiệu chỉnh múi giờ lịch sử Việt Nam và luận giải chi tiết bằng công nghệ Trí tuệ Nhân tạo AI." />
    <link rel="icon" type="image/png" href="/app-icon-tight.png" />
    <link rel="apple-touch-icon" href="/app-icon-tight.png" />
    <title>Lá Số Tử Vi & Luận Giải AI</title>
    <!-- Áp theme TRƯỚC khi paint (chống nháy sáng/tối): có lựa chọn đã lưu thì theo lựa chọn,
         chưa chọn bao giờ thì theo hệ điều hành. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("tuvi_theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <script>
      (function() {
        var _fetch = window.fetch;
        var _currentFetch = _fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Failed to redefine window.fetch descriptor:", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
